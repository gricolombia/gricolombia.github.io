<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: one narrow field-app column (phone first), sticky brand bar, bottom tab bar. Single dark look taken from the GRI badges. */
:root{
  --bg:#0c0b0c; --surface:#161415; --surface-2:#1f1c1d; --line:#332d2c;
  --fg:#f5f1ee; --muted:#a39893; --accent:#ff5a14; --accent-ink:#140803;
  --ok:#3fbf7f; --warn:#f2b33d; --bad:#ff4d4d;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mono{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.02em}
.bar .t{display:flex;flex-direction:column;min-width:0}
.bar .t b{font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.bar .t span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pulse{display:block;width:100%;height:14px;color:var(--accent)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:14px}
.notice b{color:var(--fg)}
.notice.alert{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--fg)}

.hero{padding-block:22px 6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1;text-transform:uppercase;margin-top:6px}
.hero p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
@media(min-width:620px){.areas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.area{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;cursor:pointer;transition:border-color .15s,transform .15s}
.area:hover{border-color:var(--accent);transform:translateY(-2px)}
.area img{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%}
.area .n{font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.area .s{font-size:12px;color:var(--muted);line-height:1.2}
.area .r{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.head{display:flex;align-items:center;gap:12px;padding-block:18px 4px}
.head img{width:64px;height:64px;border-radius:50%;flex:none}
.head h2{font-size:26px;line-height:1;text-transform:uppercase}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.back{background:none;border:0;color:var(--muted);padding:12px 0 0;cursor:pointer;font-size:14px}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:14px 0 0;padding:14px 14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;min-width:0}
legend{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 6px;color:var(--accent)}
.f{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.f.half{grid-column:auto}
@media(max-width:480px){.f.half{grid-column:1/-1}}
.f>label,.f>.lb{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
.req::after{content:" *";color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=month],input[type=number],input[type=tel],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px;background:var(--surface-2);cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.risk{grid-column:1/-1;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:13px}
.invalid{border-color:var(--bad)!important}
.invalid .opt span{border-color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn.ghost{background:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions .btn.pri{flex:1 1 220px}

.list{display:grid;gap:10px;margin-top:14px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;cursor:pointer}
.rec img{width:40px;height:40px;border-radius:50%}
.rec .m{min-width:0}
.rec .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .m span{font-size:13px;color:var(--muted)}
.code{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);letter-spacing:.04em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);margin-top:14px}
.empty b{color:var(--fg);display:block;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}

.dl{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:12px}
.dl h3{grid-column:1/-1;background:var(--surface-2);font-size:16px;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;color:var(--accent)}
.dl dt,.dl dd{margin:0;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.dl dt{color:var(--muted)}

.areapick{display:flex;gap:8px;overflow-x:auto;padding-block:4px 6px;margin-top:12px;scrollbar-width:thin}
.areapick button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.areapick img{width:28px;height:28px;border-radius:50%}
.areapick button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.kpis{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:14px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}
.kpi .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.kpi .nm{font-size:14px;font-weight:600;line-height:1.25}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:16px;color:var(--muted);margin-left:2px}
.kpi .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.kpi .metaIn{width:90px;min-height:34px;padding:4px 8px}
.bars{display:grid;gap:8px;margin-top:6px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:end;font-size:13px}
.barrow .lab{color:var(--muted);margin-bottom:3px}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.barrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;margin-top:14px;display:grid;gap:10px}
.card h3{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
@media(min-width:620px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mj{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.mj:first-of-type{border-top:0;padding-top:0}
.mj .k{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mj .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px}
.mj select{min-height:34px;padding:4px 8px;width:auto}
.mjform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mjform .f{grid-column:1/-1}.mjform .f.half{grid-column:auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.h2{font-size:22px;text-transform:uppercase;margin-top:22px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const cls=`f${f.half?' half':''}`, rq=f.req?' req':'', e=S.errors[f.k]?`<div class="err">${esc(S.errors[f.k])}</div>`:'';
  const inv=S.errors[f.k]?' invalid':'';

  if(f.t==='check') return `<label class="check" data-w="${f.k}"><input type="checkbox" id="${f.k}" name="${f.k}"> ${esc(f.l)}</label>`;
  if(f.t==='radio'||f.t==='multi'){
    const type=f.t==='radio'?'radio':'checkbox';
    return `<div class="${cls}" data-w="${f.k}"><span class="lb${rq}">${esc(f.l)}</span><div class="opts${inv}" id="${f.k}" role="group">${f.o.map((o,i)=>`<label class="opt"><input type="${type}" name="${f.k}" id="${f.k}-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>${e}</div>`;
  }
  let input;
  if(f.t==='select') input=`<select id="${f.k}" name="${f.k}" class="${inv}"><option value="">Selecciona…</option>${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='textarea') input=`<textarea id="${f.k}" name="${f.k}" class="${inv}" placeholder="${esc(f.ph||'')}"></textarea>`;
  else input=`<input type="${f.t}" id="${f.k}" name="${f.k}" class="${inv}" ${f.t==='number'?'step="any" inputmode="decimal" min="0"':''} placeholder="${esc(f.ph||'')}" autocomplete="off">`;
  return `<div class="${cls}" data-w="${f.k}"><label class="${rq.trim()}" for="${f.k}">${esc(f.l)}</label>${input}${e}</div>`;
}
function readForm(a){
  const fd=new FormData($('#form')), r={};
  a.fields.forEach(f=>{
    if(f.t==='multi') r[f.k]=fd.getAll(f.k);
    else if(f.t==='check') r[f.k]=!!(document.getElementById(f.k)||{}).checked;
    else { const v=fd.get(f.k); r[f.k]=v==null?'':String(v).trim(); if(f.t==='number'&&r[f.k]!=='') r[f.k]=Number(r[f.k]); }
  });
  a.sections.forEach(s=>s[1].forEach(f=>{ if(f.t==='note') return; if(!secVisible(s,r)||!visible(f,r)) r[f.k]=f.t==='multi'?[]:f.t==='check'?false:''; }));
  return r;
}
function fillForm(a,r){
  a.fields.forEach(f=>{const v=r[f.k]; if(v===undefined) return;
    if(f.t==='multi'||f.t==='radio'){const vs=Array.isArray(v)?v:[v];document.querySelectorAll(`[name="${f.k}"]`).forEach(i=>i.checked=vs.includes(i.value))}
    else{const el=document.getElementById(f.k);if(!el)return;if(f.t==='check')el.checked=!!v;else el.value=v??''}});
}
function applyVisibility(a){
  const fd=new FormData($('#form')), raw={};
  a.fields.forEach(f=>{ if(f.t==='multi') raw[f.k]=fd.getAll(f.k); else if(f.t==='check') raw[f.k]=!!(document.getElementById(f.k)||{}).checked; else raw[f.k]=fd.get(f.k)||''; });
  a.sections.forEach((s,i)=>{const fs=document.getElementById('sec'+i); if(fs) fs.hidden=!secVisible(s,raw);
    s[1].forEach(f=>{const w=document.querySelector(`[data-w="${f.k}"]`); if(w) w.hidden=!visible(f,raw)})});
}
function validate(a,r){
  const e={};
  a.sections.forEach(s=>{ if(!secVisible(s,r)) return; s[1].forEach(f=>{ if(!f.req||!visible(f,r)) return; const v=r[f.k]; if(v===''||v==null||(Array.isArray(v)&&!v.length)) e[f.k]='Este dato es obligatorio.'; }); });
  return Object.assign(e,a.check?a.check(r):{});
}

/* KPI */
function metaOf(a,k){const m=S.metas[a.id]&&S.metas[a.id][k.id];return m==null||m===''?k.meta:Number(m)}
function kpiState(k,v,m){
  if(k.dir==='info'||v==null) return '';
  if(k.dir==='up') return v>=m?'ok':v>=m*0.9?'warn':'bad';
  if(m===0) return v===0?'ok':'bad';
  return v<=m?'ok':v<=m*1.15?'warn':'bad';
}
const STATE_TXT={ok:'Cumple',warn:'En riesgo',bad:'No cumple','':'Sin meta'};
function fmtV(v,u){if(v==null)return'—';const d=(u==='%'||u==='#')?0:1;const n=Number(v.toFixed(d));return n.toLocaleString('es-CO')}
function computeKpis(a,rows,all){return a.kpis.map(k=>{const v=k.c(k.all?all:rows);const m=metaOf(a,k);return {k,v,m,st:kpiState(k,v,m)}})}

function allRecords(){return Object.values(S.all).flat()}
function areaRows(id){const a=areaById[id];return allRecords().filter(r=>r.area===id).sort((x,y)=>(a.date(y)||'').localeCompare(a.date(x)||''))}
function filtered(){const f=S.filt,a=areaById[f.area];return areaRows(f.area).filter(r=>{const d=a.date(r)||'';return(!f.desde||d>=f.desde)&&(!f.hasta||d<=f.hasta)})}
function countBy(rows,key){const m={};rows.forEach(r=>{const v=r[key];(Array.isArray(v)?v:[v]).filter(x=>x!==''&&x!=null).forEach(x=>m[x]=(m[x]||0)+1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(rows,key){const c=countBy(rows,key);if(!c.length)return `<div class="hint">Sin datos en este periodo.</div>`;const max=c[0][1];
  return `<div class="bars">${c.map(([k,v])=>`<div class="barrow"><div><div class="lab">${esc(k)}</div><div class="track"><div class="fill" style="width:${Math.max(4,v/max*100)}%"></div></div></div><div class="v">${v}</div></div>`).join('')}</div>`}
function periodTxt(){const f=S.filt;return f.desde||f.hasta?`${f.desde?fmtDate(f.desde):'el inicio'} a ${f.hasta?fmtDate(f.hasta):'hoy'}`:'Todo el historial'}

/* ================= wiring ================= */
let draftT;
function wireForm(){
  const a=areaById[S.area], f=$('#form');
  let d=null;try{d=JSON.parse(localStorage.getItem(DRAFT(a.id))||'null')}catch(_){}
  if(S.pending)fillForm(a,S.pending);else if(d)fillForm(a,d);else{
    const now=new Date(),dd=now.toLocaleDateString('en-CA'),tt=now.toTimeString().slice(0,5);
    a.fields.forEach(x=>{const el=document.getElementById(x.k);if(!el)return;
      if(x.t==='date'&&(x.k==='fecha'||x.k==='fechaReporte'))el.value=dd;
      if(x.t==='time'&&['hora','horaLlamado','horaActivacion','horaInicio'].includes(x.k))el.value=tt;
      if(x.t==='month')el.value=dd.slice(0,7);});
  }
  S.pending=null;applyVisibility(a);
  f.addEventListener('input',()=>{applyVisibility(a);clearTimeout(draftT);draftT=setTimeout(()=>{try{localStorage.setItem(DRAFT(a.id),JSON.stringify(readForm(a)))}catch(_){}},500)});
  f.addEventListener('change',()=>applyVisibility(a));
  $('#clearBtn').onclick=()=>{try{localStorage.removeItem(DRAFT(a.id))}catch(_){}S.errors={};S.pending=null;go('form')};
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const r=readForm(a),e=validate(a,r);
    if(Object.keys(e).length){S.errors=e;S.pending=r;render();const first=document.querySelector('.invalid');if(first)first.scrollIntoView({block:'center'});return}
    S.errors={};const btn=$('#saveBtn');btn.disabled=true;btn.textContent='Guardando…';
    try{
      const now=new Date(),d=(a.date(r)||today()).replaceAll('-','');
      const id=`${a.pre}-${d}-${now.toTimeString().slice(0,5).replace(':','')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
      const rec={...r,area:a.id,codigo:id,creado:now.toISOString()};
      rec.uid=S.uid;
      const w=S.db.doc(`registros/${id}`).set(rec);
      w.catch(()=>toast('El servidor rechazó el registro '+id+'. Avisa al coordinador.'));
      const r2=await Promise.race([w.then(()=>'ok'),new Promise(res=>setTimeout(()=>res('pend'),5000))]);
      try{localStorage.removeItem(DRAFT(a.id))}catch(_){}
      toast(r2==='ok'?'Registro guardado':'Sin señal: quedó guardado en el celular y se enviará solo cuando haya conexión');
      go('detalle',{detail:{...rec,_uid:S.uid,_path:`registros/${id}`},back:'mis'});
    }catch(err){btn.disabled=false;btn.textContent='Guardar registro';
      toast(err&&err.code==='permission-denied'?'La base de datos rechazó el registro. Avisa al coordinador.':'No se pudo guardar. Revisa tu conexión e intenta de nuevo.')}
  });
}
function wirePanel(){
  const a=areaById[S.filt.area];
  const okDate=v=>!v||/^(19|20)\d\d-/.test(v);
  ['#fDesde','#fHasta'].forEach(s=>{const el=$(s);
    const apply=()=>{const d=$('#fDesde').value,h=$('#fHasta').value;if(!okDate(d)||!okDate(h))return;if(d===S.filt.desde&&h===S.filt.hasta)return;S.filt.desde=d;S.filt.hasta=h;render()};
    el.addEventListener('blur',apply);el.addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
    el.addEventListener('change',apply);});
  $('#xWord').onclick=()=>wordConsolidado();$('#xPdf').onclick=()=>pdfConsolidado();$('#xExcel').onclick=()=>excel();
  const me=$('#metaEdit');if(me)me.onclick=()=>{S.editMetas=true;render()};
  const mc=$('#metaCancel');if(mc)mc.onclick=()=>{S.editMetas=false;render()};
  const ms=$('#metaSave');if(ms)ms.onclick=async()=>{
    const m={...S.metas,[a.id]:{...(S.metas[a.id]||{})}};
    a.kpis.forEach(k=>{const el=document.getElementById('meta-'+k.id);if(el&&el.value!=='')m[a.id][k.id]=Number(el.value)});
    try{await S.db.doc('config/metas').set(m);S.metas=m;S.editMetas=false;toast('Metas guardadas');render()}catch(_){toast('No se pudieron guardar las metas.')}
  };
  document.querySelectorAll('[data-mjk]').forEach(b=>b.onclick=()=>{S.mjKpi=b.dataset.mjk;render();const s=$('#mjKpi');s.value=S.mjKpi;$('#mjAccion').focus();$('#mejoras').scrollIntoView({block:'start'})});
  $('#mjSave').onclick=async()=>{
    const accion=$('#mjAccion').value.trim();if(!accion){toast('Escribe la acción de mejora.');$('#mjAccion').focus();return}
    const doc={area:a.id,kpi:$('#mjKpi').value,accion,responsable:$('#mjResp').value.trim(),fechaLimite:$('#mjFecha').value,estado:'Pendiente',creado:new Date().toISOString()};
    try{await S.db.collection('mejoras').add(doc);['mjAccion','mjResp','mjFecha'].forEach(id=>$('#'+id).value='');S.mjKpi='';toast('Acción de mejora agregada')}catch(_){toast('No se pudo guardar la acción.')}
  };
  document.querySelectorAll('[data-mjestado]').forEach(s=>s.onchange=async()=>{try{await S.db.doc('mejoras/'+s.dataset.mjestado).update({estado:s.value});toast('Estado actualizado')}catch(_){toast('No se pudo actualizar.')}});
  document.querySelectorAll('[data-mjask]').forEach(b=>b.onclick=()=>{S.confirmMj=b.dataset.mjask;render()});
  document.querySelectorAll('[data-mjno]').forEach(b=>b.onclick=()=>{S.confirmMj=null;render()});
  document.querySelectorAll('[data-mjdel]').forEach(b=>b.onclick=async()=>{try{await S.db.doc('mejoras/'+b.dataset.mjdel).delete();S.confirmMj=null;toast('Acción eliminada')}catch(_){toast('No se pudo eliminar.')}});
}
function wireDetail(){
  $('#dWord').onclick=()=>wordRecord(S.detail);$('#dPdf').onclick=()=>pdfRecord(S.detail);
  const sd=$('#segDone');if(sd)sd.onclick=async()=>{try{const f=today();await S.db.doc(S.detail._path).update({seguimientoRealizado:true,seguimientoFecha:f});S.detail={...S.detail,seguimientoRealizado:true,seguimientoFecha:f};toast('Seguimiento registrado');render()}catch(_){toast('No se pudo actualizar.')}};
  const ask=$('#delAsk');if(ask)ask.onclick=()=>{S.confirmDel=S.detail._path;render()};
  const no=$('#delNo');if(no)no.onclick=()=>{S.confirmDel=null;render()};
  const yes=$('#delYes');if(yes)yes.onclick=async()=>{try{await S.db.doc(S.detail._path).delete();toast('Registro eliminado');go(S.back)}catch(_){toast('No se pudo eliminar.')}};
}

/* ================= exports ================= */
async function save(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Descargando '+filename)}
  catch(_){toast('No se pudo descargar el archivo.')}
}
const b64=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
function recSections(a,r){return a.sections.filter(s=>secVisible(s,r)).map(s=>[s[0],s[1].filter(f=>f.t!=='note'&&visible(f,r)&&has(r[f.k])).map(f=>[f.l,fmtField(f,r[f.k])])]).filter(s=>s[1].length)}
function summaryRows(a,rows){return computeKpis(a,rows,areaRows(a.id)).map(({k,v,m,st})=>[k.n,`${fmtV(v,k.u)} ${k.u==='#'?'':k.u}`.trim(),k.dir==='info'?'Referencia':`${k.dir==='up'?'≥':'≤'} ${fmtV(m,k.u)} ${k.u==='#'?'':k.u}`.trim(),v==null?'Sin datos':(STATE_TXT[st]||'—')])}
function mejorasRows(a){return S.mejoras.filter(m=>m.area===a.id).map(m=>[(a.kpis.find(k=>k.id===m.kpi)||{n:'General'}).n,m.accion,m.responsable||'',fmtDate(m.fechaLimite),m.estado])}
function detailCols(a){return [['Fecha',r=>fmtDate(a.date(r))],['Código',r=>r.codigo],['Registro',r=>a.title(r)],['Detalle',r=>a.sub(r)],['Responsable',r=>r.interviniente||'']]}
const stamp=()=>new Date().toLocaleDateString('en-CA');

/* Word */
function D(){return window.docx}
function wHeader(a,title,sub){const d=D(),none={style:d.BorderStyle.NONE,size:0,color:'FFFFFF'},nb={top:none,bottom:none,left:none,right:none,insideHorizontal:none,insideVertical:none};
  return [new d.Table({width:{size:100,type:d.WidthType.PERCENTAGE},borders:nb,rows:[new d.TableRow({children:[
    new d.TableCell({width:{size:16,type:d.WidthType.PERCENTAGE},borders:nb,children:[new d.Paragraph({children:[new d.ImageRun({data:b64(PNG[a.id]),transformation:{width:80,height:80}})]})]}),
    new d.TableCell({width:{size:84,type:d.WidthType.PERCENTAGE},borders:nb,verticalAlign:d.VerticalAlign.CENTER,children:[
      new d.Paragraph({children:[new d.TextRun({text:'GRUPO DE RESCATE INTEGRAL – GRI',bold:true,size:20,color:'E0480A'})]}),
      new d.Paragraph({children:[new d.TextRun({text:title,bold:true,size:30})]}),
      new d.Paragraph({children:[new d.TextRun({text:sub,size:18,color:'666666'})]})]})]})]}),
    new d.Paragraph({border:{bottom:{style:d.BorderStyle.SINGLE,size:12,color:'FF5A14',space:4}},children:[]})]}
function wH(t){const d=D();return new d.Paragraph({spacing:{before:240,after:100},children:[new d.TextRun({text:t.toUpperCase(),bold:true,size:22,color:'E0480A'})]})}
function wTable(head,rows,kv){const d=D(),b={style:d.BorderStyle.SINGLE,size:4,color:'D9D2CE'},brd={top:b,bottom:b,left:b,right:b};
  const cell=(t,o={})=>new d.TableCell({borders:brd,width:o.w?{size:o.w,type:d.WidthType.PERCENTAGE}:undefined,shading:o.fill?{fill:o.fill,type:d.ShadingType.CLEAR,color:'auto'}:undefined,
    children:String(t??'—').split('\n').map(l=>new d.Paragraph({children:[new d.TextRun({text:l,bold:!!o.b,size:o.s||18,color:o.c})]}))});
  const R=[];if(head)R.push(new d.TableRow({tableHeader:true,children:head.map(h=>cell(h,{fill:'FF5A14',b:1,c:'FFFFFF'}))}));
  rows.forEach(r=>R.push(new d.TableRow({children:r.map((x,i)=>kv&&i===0?cell(x,{w:34,fill:'F4EFEC',b:1}):cell(x,kv?{w:66}:{}))})));
  return new d.Table({width:{size:100,type:d.WidthType.PERCENTAGE},rows:R})}
function wNote(t){const d=D();return new d.Paragraph({spacing:{before:240},children:[new d.TextRun({text:t,italics:true,size:16,color:'777777'})]})}
async function wordRecord(r){
  const d=D();if(!d){toast('No se pudo preparar el Word. Revisa tu conexión.');return}
  const a=areaById[r.area];const ch=[...wHeader(a,a.form,`${a.sigla} · ${a.nombre} · Código ${r.codigo}`)];
  recSections(a,r).forEach(([t,rows])=>{ch.push(wH(t));ch.push(wTable(null,rows,true))});
  if(a.follow&&a.follow.when(r)){ch.push(wH('Seguimiento'));ch.push(wTable(null,[['Estado',r.seguimientoRealizado?`Realizado el ${fmtDate(r.seguimientoFecha)}`:'Pendiente']],true))}
  ch.push(new d.Paragraph({spacing:{before:600},children:[new d.TextRun({text:'_______________________________',size:20})]}));
  ch.push(new d.Paragraph({children:[new d.TextRun({text:`${r.interviniente||''}${r.cargo?' – '+r.cargo:''}`,size:19})]}));
  ch.push(wNote('Documento de uso interno del GRI. Puede contener información sensible de las personas atendidas.'));
  const doc=new d.Document({creator:'GRI',title:r.codigo,sections:[{properties:{page:{margin:{top:900,bottom:900,left:1000,right:1000}}},children:ch}]});
  await save(`${r.codigo}.docx`,await d.Packer.toBlob(doc));
}
async function wordConsolidado(){
  const d=D();if(!d){toast('No se pudo preparar el Word. Revisa tu conexión.');return}
  const a=areaById[S.filt.area],rows=filtered();
  const ch=[...wHeader(a,`Informe de gestión ${a.sigla}`,`${a.nombre} · Periodo: ${periodTxt()} · Generado el ${new Date().toLocaleDateString('es-CO')}`)];
  ch.push(wH('Indicadores (KPI)'));ch.push(wTable(['Indicador','Resultado','Meta','Estado'],summaryRows(a,rows)));
  const mj=mejorasRows(a);ch.push(wH('Acciones de mejora'));ch.push(mj.length?wTable(['Indicador','Acción','Responsable','Fecha límite','Estado'],mj):new d.Paragraph({children:[new d.TextRun({text:'Sin acciones registradas.',size:18})]}));
  a.charts.forEach(([t,k])=>{const c=countBy(rows,k);if(c.length){ch.push(wH(t));ch.push(wTable(['Categoría','Cantidad'],c))}});
  ch.push(wH('Detalle de registros'));const cols=detailCols(a);ch.push(wTable(cols.map(c=>c[0]),rows.map(r=>cols.map(c=>c[1](r)))));
  ch.push(wNote('Documento de uso interno del GRI.'));
  const doc=new d.Document({creator:'GRI',title:`Informe ${a.sigla}`,sections:[{properties:{page:{size:{orientation:d.PageOrientation.LANDSCAPE},margin:{top:800,bottom:800,left:800,right:800}}},children:ch}]});
  await save(`Informe-${a.pre}-${stamp()}.docx`,await d.Packer.toBlob(doc));
}

/* PDF */
const ORANGE=[255,90,20];
function pdfNew(land){if(!window.jspdf){toast('No se pudo preparar el PDF. Revisa tu conexión.');return null}return new window.jspdf.jsPDF({unit:'pt',format:'letter',orientation:land?'landscape':'portrait'})}
function pHeader(doc,a,title,sub){const W=doc.internal.pageSize.getWidth();
  doc.addImage('data:image/png;base64,'+PNG[a.id],'PNG',40,30,58,58);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(224,72,10);doc.text('GRUPO DE RESCATE INTEGRAL – GRI',110,46);
  doc.setFontSize(16);doc.setTextColor(25,25,25);doc.text(title,110,66);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110,110,110);doc.text(doc.splitTextToSize(sub,W-150),110,82);
  doc.setDrawColor(...ORANGE);doc.setLineWidth(2);doc.line(40,100,W-40,100);return 114}
function pFooter(doc,txt){const n=doc.getNumberOfPages(),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130,130,130);doc.text(txt,40,H-24);doc.text(`Página ${i} de ${n}`,W-40,H-24,{align:'right'})}}
function pKV(doc,y,title,rows){doc.autoTable({startY:y,head:[[{content:title.toUpperCase(),colSpan:2}]],body:rows,theme:'grid',margin:{left:40,right:40},
  styles:{fontSize:9,cellPadding:5,lineColor:[217,210,206],textColor:[30,30,30]},headStyles:{fillColor:ORANGE,textColor:255,fontStyle:'bold'},
  columnStyles:{0:{cellWidth:170,fontStyle:'bold',fillColor:[244,239,236]}}});return doc.lastAutoTable.finalY+12}
function pTable(doc,y,title,head,rows){if(title){doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(224,72,10);
  if(y>doc.internal.pageSize.getHeight()-80){doc.addPage();y=40}doc.text(title.toUpperCase(),40,y+4);y+=10}
  doc.autoTable({startY:y,head:[head],body:rows,theme:'grid',margin:{left:40,right:40},styles:{fontSize:8.5,cellPadding:4,lineColor:[217,210,206],textColor:[30,30,30]},headStyles:{fillColor:ORANGE,textColor:255}});
  return doc.lastAutoTable.finalY+16}
async function pdfRecord(r){
  const doc=pdfNew(false);if(!doc)return;const a=areaById[r.area];
  let y=pHeader(doc,a,a.form,`${a.sigla} · ${a.nombre} · Código ${r.codigo}`);
  recSections(a,r).forEach(([t,rows])=>{y=pKV(doc,y,t,rows)});
  if(a.follow&&a.follow.when(r))y=pKV(doc,y,'Seguimiento',[['Estado',r.seguimientoRealizado?`Realizado el ${fmtDate(r.seguimientoFecha)}`:'Pendiente']]);
  if(y>doc.internal.pageSize.getHeight()-110){doc.addPage();y=60}
  doc.setDrawColor(60,60,60);doc.setLineWidth(.6);doc.line(40,y+50,240,y+50);doc.setFontSize(9);doc.setTextColor(30,30,30);doc.text(`${r.interviniente||''}${r.cargo?' – '+r.cargo:''}`,40,y+64);
  pFooter(doc,'Documento de uso interno del GRI. Puede contener información sensible.');
  await save(`${r.codigo}.pdf`,doc.output('blob'));
}
async function pdfConsolidado(){
  const doc=pdfNew(true);if(!doc)return;const a=areaById[S.filt.area],rows=filtered();
  let y=pHeader(doc,a,`Informe de gestión ${a.sigla}`,`${a.nombre} · Periodo: ${periodTxt()} · Generado el ${new Date().toLocaleDateString('es-CO')}`);
  doc.autoTable({startY:y,head:[['Indicador','Resultado','Meta','Estado']],body:summaryRows(a,rows),theme:'grid',margin:{left:40,right:40},
    styles:{fontSize:9,cellPadding:5,lineColor:[217,210,206],textColor:[30,30,30]},headStyles:{fillColor:ORANGE,textColor:255},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===3){const t=h.cell.raw;h.cell.styles.fontStyle='bold';h.cell.styles.textColor=t==='Cumple'?[30,140,80]:t==='En riesgo'?[190,130,0]:t==='No cumple'?[200,40,40]:[110,110,110]}}});
  y=doc.lastAutoTable.finalY+20;
  const mj=mejorasRows(a);y=pTable(doc,y,'Acciones de mejora',['Indicador','Acción','Responsable','Fecha límite','Estado'],mj.length?mj:[['—','Sin acciones registradas','','','']]);
  a.charts.forEach(([t,k])=>{const c=countBy(rows,k);if(c.length)y=pTable(doc,y,t,['Categoría','Cantidad'],c)});
  const cols=detailCols(a);pTable(doc,y,'Detalle de registros',cols.map(c=>c[0]),rows.map(r=>cols.map(c=>c[1](r))));
  pFooter(doc,`Informe de gestión ${a.sigla} · GRI · Uso interno`);
  await save(`Informe-${a.pre}-${stamp()}.pdf`,doc.output('blob'));
}

/* Excel */
async function excel(){
  if(!window.XLSX){toast('No se pudo preparar el Excel. Revisa tu conexión.');return}
  const a=areaById[S.filt.area],rows=filtered();
  const data=rows.map(r=>{const o={'Código':r.codigo};a.fields.forEach(f=>o[f.l]=fmtField(f,r[f.k]));if(a.follow)o['Seguimiento realizado']=r.seguimientoRealizado?'Sí':'No';o['Registrado el']=r.creado?new Date(r.creado).toLocaleString('es-CO'):'';return o});
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=Object.keys(data[0]||{}).map(k=>({wch:Math.min(40,Math.max(12,k.length+2))}));
  XLSX.utils.book_append_sheet(wb,ws,'Registros');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Indicador','Resultado','Meta','Estado'],...summaryRows(a,rows)]),'Indicadores');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Indicador','Acción','Responsable','Fecha límite','Estado'],...mejorasRows(a)]),'Acciones de mejora');
  await save(`Registros-${a.pre}-${stamp()}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]));
}

/* ================= data ================= */
function mapSnap(s){return s.docs.map(d=>({...d.data(),area:d.data().area||'psh',_uid:d.data().uid,_path:`registros/${d.id}`}))}
function refreshView(){if(S.view==='mis'||S.view==='panel')render();else renderTabs()}
let unsubs=[];
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];S.mine=[];S.all={};S.metas={};S.mejoras=[];
  const db=S.db;
  unsubs.push(db.collection('registros').where('uid','==',S.uid).onSnapshot(s=>{S.mine=mapSnap(s).sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));refreshView()},()=>{}));
  if(S.owner){
    unsubs.push(db.collection('registros').onSnapshot(s=>{S.all={todos:mapSnap(s)};refreshView()},()=>toast('No se pudieron leer los registros: revisa las reglas de Firestore.')));
    unsubs.push(db.doc('config/metas').onSnapshot(s=>{S.metas=(s.exists&&s.data())||{};if(!S.editMetas)refreshView()},()=>{}));
    unsubs.push(db.collection('mejoras').onSnapshot(s=>{S.mejoras=s.docs.map(d=>({...d.data(),_id:d.id}));refreshView()},()=>{}));
  }
}
document.addEventListener('click',async e=>{
  if(e.target.closest('#login')){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await firebase.auth().signInWithPopup(p)}catch(err){if(err&&/popup/.test(err.code||''))firebase.auth().signInWithRedirect(p);else toast('No se pudo iniciar sesión.')}}
  if(e.target.closest('#logout')){await firebase.auth().signOut()}
});
function init(){
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){S.ready=true;S.authError=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  S.db=firebase.firestore();
  S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const auth=firebase.auth();
  auth.onAuthStateChanged(async u=>{
    if(!u){try{await auth.signInAnonymously()}catch(_){S.authError=true;S.ready=true;render()}return}
    S.uid=u.uid;S.email=u.isAnonymous?'':(u.email||'');S.owner=!u.isAnonymous&&!!S.email&&S.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
    S.authError=false;S.ready=true;subscribe();
    if(S.view==='panel'&&!S.owner)S.view='inicio';
    render();
  });
}
render();init();
</script>
